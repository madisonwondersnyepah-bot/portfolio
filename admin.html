<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Madz portfolio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap { max-width: 42rem; margin: 0 auto; padding: var(--gap) 1.5rem; }
  .admin-wrap h1 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 0.25rem; }
  .admin-wrap .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0; }
  .field { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .field label { font-family: var(--font-display); font-size: 0.85rem; }
  .field input[type="text"],
  .field input[type="url"],
  .field input[type="password"],
  .field select {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 2px;
  }
  .field input[type="file"] { font-family: var(--font-body); }
  .admin-form { border: 1px solid var(--line); padding: 1.5rem; margin-top: 1.5rem; }
  #msg { font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }
  #msg.ok { color: var(--accent); }
  #msg.err { color: var(--accent-rust); }
  .existing { margin-top: 2.5rem; }
  .existing-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--line);
  }
  .existing-item img,
  .existing-item video { width: 64px; height: 48px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; }
  .existing-item .meta { flex: 1; min-width: 0; }
  .existing-item .meta strong { display: block; font-size: 0.9rem; }
  .existing-item .meta span { font-size: 0.78rem; color: var(--muted); }
  .gate { max-width: 24rem; margin: 4rem auto; text-align: center; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>Admin</h1>
  <p class="sub">Enter the site password to manage your work.</p>
  <div class="field">
    <input type="password" id="password-input" placeholder="Password">
  </div>
  <button class="btn" id="unlock-btn">Unlock</button>
  <p id="gate-msg" class="err"></p>
</div>

<div id="panel" class="admin-wrap" hidden>
  <h1>Manage your work</h1>
  <p class="sub">Uploads show up on the Design &amp; video section of your homepage.</p>

  <form id="upload-form" class="admin-form">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" required>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option>Graphic design</option>
        <option>Video editing</option>
      </select>
    </div>

    <div class="field">
      <label for="caption">Caption (optional)</label>
      <input type="text" id="caption">
    </div>

    <div class="field">
      <label for="link">Link to full piece (optional — YouTube, Behance, Drive, etc.)</label>
      <input type="url" id="link" placeholder="https://">
    </div>

    <div class="field">
      <label for="image">Thumbnail image or short video clip (up to ~300MB)</label>
      <input type="file" id="image" accept="image/*,video/*" required>
    </div>

    <button type="submit" class="btn" id="submit-btn">Upload</button>
    <p id="msg"></p>
  </form>

  <div class="existing">
    <h2 style="font-family: var(--font-display); font-size: 1rem; color: var(--accent);">Currently on your site</h2>
    <div id="existing-list"></div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
